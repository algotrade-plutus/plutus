name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp,test]"

      - name: Run test suite
        run: pytest -q --cov=plutus --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Assert dev-only trees are excluded from the wheel
        run: |
          python - <<'PY'
          import pathlib, zipfile, sys

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          leaked = [n for n in names if "/experiment/" in n]
          if leaked:
              print("Dev-only files leaked into the wheel:")
              for n in leaked:
                  print("  ", n)
              sys.exit(1)
          print(f"OK: {wheel.name} carries {len(names)} files, no dev-only trees.")
          PY
